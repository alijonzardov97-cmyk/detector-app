name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # кнопка "Run workflow" на вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ВЕРСИИ ДЕЙСТВИЙ ПРИХОДИТСЯ ПОДНИМАТЬ, И ВОТ ПОЧЕМУ.
      #
      # GitHub убрал со своих раннеров Node.js 20. Действия, написанные под
      # него, теперь принудительно запускаются на Node.js 24, и часть из них
      # этого не переживает. Именно так сломалась сборка: шаг
      # android-actions/setup-android@v3 падал ещё до того, как дело доходило
      # до исходников, а следующие шаги помечались как пропущенные — в логе
      # это выглядело как «приложение не собирается», хотя код тут ни при чём.
      #
      # Все четыре действия подняты до версий, собранных под Node.js 24.
      # Входные параметры у них те же, что и раньше.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4   # ставит SDK и принимает лицензии

      # ВЕРСИЯ GRADLE ЗАФИКСИРОВАНА НАМЕРЕННО.
      #
      # Без этой строки берётся тот Gradle, который стоит на раннере GitHub, а
      # он обновляется сам по себе. Плагин Android 8.7 работает с ветками 8.x;
      # когда на раннере появился Gradle 9, сборка начала падать после того,
      # как все задачи уже выполнились, — и в логе оставалось только
      # «BUILD FAILED» с рассуждением о совместимости с Gradle 10.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'


      # СБОРКА С ВЫНОСОМ ОШИБОК КОМПИЛЯТОРА НА ВИДНОЕ МЕСТО.
      #
      # Раньше здесь была одна строка `gradle assembleDebug`. Когда сборка
      # падала, в хвосте лога оставалось только «BUILD FAILED» и рассуждения
      # Gradle о задачах, а настоящая причина — строки вида
      #     e: file:///.../MainActivity.kt:812:30 Unresolved reference: foo
      # — оказывалась на сотню строк выше и в присланном куске лога её не было.
      #
      # Теперь вывод сохраняется в файл, все строки «e:» печатаются отдельным
      # блоком в конце шага И дублируются как аннотации GitHub. Аннотации видны
      # на вкладке Actions отдельным списком над логом — их не нужно искать.
      - name: Собрать debug APK
        run: |
          set -o pipefail
          rc=0
          gradle assembleDebug --no-daemon --warning-mode=none --console=plain 2>&1 \
            | tee build.log || rc=$?

          echo ""
          echo "================= ОШИБКИ КОМПИЛЯТОРА KOTLIN ================="
          grep -E '^e: ' build.log || echo "(строк, начинающихся с 'e:', в логе нет)"
          echo "============================================================"
          echo ""

          if [ "$rc" != "0" ]; then
            # head -20: аннотаций больше двадцати GitHub всё равно не покажет,
            # а первая ошибка почти всегда и есть настоящая причина.
            grep -E '^e: ' build.log | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$rc"
          fi

      # Имя файла с версией. Без этого все сборки называются app-debug.apk,
      # в папке загрузок они сливаются в одну кучу, и на телефон легко
      # поставить предыдущую, ничего не заметив.
      - name: Переименовать APK по версии
        id: rename
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "STT-Defense-$V.apk"
          ls -l "STT-Defense-$V.apk"

      # Тоже поднято: четвёртая версия собрана под Node.js 20 и попала бы под
      # то же принудительное переселение на Node.js 24, что уронило сборку.
      - uses: actions/upload-artifact@v7
        with:
          # Номер прогона в имени — сразу видно, свежий ли архив скачан.
          name: STT-Defense-${{ steps.rename.outputs.version }}-run${{ github.run_number }}
          path: STT-Defense-*.apk
          if-no-files-found: error
