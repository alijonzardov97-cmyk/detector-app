name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # кнопка "Run workflow" на вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3   # ставит SDK и принимает лицензии

      # ВЕРСИЯ GRADLE ЗАФИКСИРОВАНА НАМЕРЕННО.
      #
      # Без этой строки берётся тот Gradle, который стоит на раннере GitHub, а
      # он обновляется сам по себе. Плагин Android 8.7 работает с ветками 8.x;
      # когда на раннере появился Gradle 9, сборка начала падать после того,
      # как все задачи уже выполнились, — и в логе оставалось только
      # «BUILD FAILED» с рассуждением о совместимости с Gradle 10.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Собрать debug APK
        # --warning-mode=none убирает простыню предупреждений, из-за которой
        # настоящая ошибка уезжала за край видимой части лога.
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode=none

      # Имя файла с версией. Без этого все сборки называются app-debug.apk,
      # в папке загрузок они сливаются в одну кучу, и на телефон легко
      # поставить предыдущую, ничего не заметив.
      - name: Переименовать APK по версии
        id: rename
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "STT-Defense-$V.apk"
          ls -l "STT-Defense-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          # Номер прогона в имени — сразу видно, свежий ли архив скачан.
          name: STT-Defense-${{ steps.rename.outputs.version }}-run${{ github.run_number }}
          path: STT-Defense-*.apk
          if-no-files-found: error
